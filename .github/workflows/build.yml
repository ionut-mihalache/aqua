name: AQUA Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Package
        run: |
          mkdir -p aqua/lib aqua/include
          cp -a build/lib/shared build/lib/static aqua/lib/
          cp include/*.h core/*/include/*.h platform/linux/include/platform-types.h aqua/include/
          cp LICENSE aqua/
          tar -czf aqua-linux-x86_64.tar.gz aqua

      - uses: actions/upload-artifact@v7
        with:
          name: aqua-linux-x86_64
          path: aqua-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel

      - name: Package
        run: |
          mkdir -p aqua/lib aqua/include
          cp -a build/lib/Release/shared build/lib/Release/static aqua/lib/
          cp include/*.h core/*/include/*.h platform/windows/include/platform-types.h aqua/include/
          cp LICENSE aqua/
          7z a aqua-windows-x64.zip aqua

      - uses: actions/upload-artifact@v7
        with:
          name: aqua-windows-x64
          path: aqua-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - run: gh release create "${{ github.ref_name }}" *.tar.gz *.zip --generate-notes --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
